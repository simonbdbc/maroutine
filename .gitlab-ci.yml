default:
  tags:
    - maroutine-runner-docker
  interruptible: true

stages:
  - validate
  - build
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  EXPO_NO_TELEMETRY: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.node:install:
  image: node:20-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm
  before_script:
    - npm ci

web:validate:
  extends: .node:install
  stage: validate
  script:
    - npm run tsc
    - npm run check:landing
    - npm run qa:theme
    - npm run pwa:contract:test

web:build:prod:
  extends: .node:install
  stage: build
  needs:
    - web:validate
  rules:
    - if: >-
        $EXPO_PUBLIC_SUPABASE_URL != null &&
        $EXPO_PUBLIC_SUPABASE_URL != "" &&
        $EXPO_PUBLIC_SUPABASE_ANON_KEY != null &&
        $EXPO_PUBLIC_SUPABASE_ANON_KEY != ""
    - when: never
  script:
    - npm run web:build:prod
    - npm run validate
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - dist

pwa:build:cloudflare:
  extends: .node:install
  stage: build
  needs:
    - web:validate
  rules:
    - if: >-
        $EXPO_PUBLIC_SUPABASE_URL != null &&
        $EXPO_PUBLIC_SUPABASE_URL != "" &&
        $EXPO_PUBLIC_SUPABASE_ANON_KEY != null &&
        $EXPO_PUBLIC_SUPABASE_ANON_KEY != ""
    - when: never
  script:
    - BUILD_ID="production-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}" npm run build:pwa:cloudflare
    - npm run validate:pwa:cloudflare
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - apps/pwa/dist

pwa:e2e:
  extends: .node:install
  stage: test
  needs:
    - job: web:build:prod
      artifacts: true
  rules:
    - if: >-
        $EXPO_PUBLIC_SUPABASE_URL != null &&
        $EXPO_PUBLIC_SUPABASE_URL != "" &&
        $EXPO_PUBLIC_SUPABASE_ANON_KEY != null &&
        $EXPO_PUBLIC_SUPABASE_ANON_KEY != ""
    - when: never
  script:
    - npx playwright install --with-deps chromium
    - npm run e2e:pwa
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/pwa/playwright-report
      - apps/pwa/test-results

pwa:deploy:cloudflare:
  extends: .node:install
  stage: deploy
  interruptible: false
  resource_group: maroutine-app-production
  needs:
    - job: pwa:build:cloudflare
      artifacts: true
    - job: pwa:e2e
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - npm run validate:pwa:deploy-env
    - >-
      npx wrangler pages deploy dist
      --cwd apps/pwa
      --project-name maroutine-app
      --branch "$CI_COMMIT_BRANCH"
      --commit-hash "$CI_COMMIT_SHA"
      --commit-message "$CI_COMMIT_TITLE"
      --commit-dirty=false
    - npm run verify:pwa:production
  environment:
    name: production/pwa
    url: https://maroutine-app.pages.dev
