<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B6B" />
    <title>Maroutine - hors ligne</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff9f7;
        color: #000;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 440px);
        border: 1px solid #e2e8f3;
        border-radius: 16px;
        background: #fff9f7;
        padding: 24px;
      }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 18px; line-height: 1.5; color: #404040; }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0 20px;
        background: #ff6b6b;
        color: #fff9f7;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connexion indisponible</h1>
      <p>Maroutine ne peut pas charger cet ecran. Retablis la connexion puis reessaie.</p>
      <button type="button" onclick="window.location.reload()">Reessayer</button>
    </main>
  </body>
</html>
